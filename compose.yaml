services:
  app:
    build: .
    image: market-lens:local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      REDIS_HOST: redis                # inside the compose network the service name is the hostname, not localhost
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy     # wait until Redis answers PING, not just "container started"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s                # failures during JVM startup don't count

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"                    # published so the app run from the host can reach it too
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
