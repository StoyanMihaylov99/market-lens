spring:
  application:
    name: market-lens
  config:
    import: classpath:scoring.yaml           # scoring thresholds and weights (model tuning, not deployment config)
  data:
    redis:                                   # used once the Redis starter is added (Phase 7)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never                    # don't leak internals publicly; the local profile shows them
      probes:
        enabled: true                        # /actuator/health/liveness and /readiness for containers
  info:
    env:
      enabled: true                          # publish the info.* properties below on /actuator/info

info:
  app:
    name: ${spring.application.name}
    description: AI-assisted stock analysis backend. Not financial advice.

# Our own settings, bound to the MarketLensProperties record (config package).
marketlens:
  market-data:
    provider: ${MARKET_DATA_PROVIDER:alphavantage}
    api-key: ${MARKET_DATA_API_KEY:}
    alphavantage:                            # bound to AlphaVantageProperties; used when provider=alphavantage
      base-url: https://www.alphavantage.co  # the mock profile points this at WireMock
      connect-timeout: 5s
      read-timeout: 10s
      min-request-interval: 12s              # free tier rejects bursts (1s was too short); 25/day cap → caching (Phase 7)
  llm:
    model: ${LLM_MODEL:llama3.2}             # default fits a local Ollama model
    api-key: ${LLM_API_KEY:}
  cache:
    analysis-ttl: ${CACHE_TTL_MINUTES:60}m   # Duration: "60m" = 60 minutes
